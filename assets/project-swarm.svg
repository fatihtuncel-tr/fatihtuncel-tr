<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130D26"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="topBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <style>
      .repo-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #C084FC; }
      .badge-txt { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; font-weight: 600; fill: #C084FC; }
      .desc-en { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #E2E8F0; font-weight: 500; }
      .desc-tr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94A3B8; }
      .tag { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; fill: #CBD5E1; }
    </style>
  </defs>

  <rect width="580" height="230" rx="14" fill="url(#bg2)" stroke="#1E293B" stroke-width="2"/>
  <rect x="0" y="0" width="580" height="4" rx="2" fill="url(#topBar2)"/>

  <!-- Repo Icon + Name -->
  <g transform="translate(26, 28)">
    <text x="0" y="18" class="repo-title">⚡ swarm-1000-code-perfectizer</text>
    <rect x="415" y="1" width="112" height="24" rx="12" fill="#7E22CE" fill-opacity="0.25" stroke="#C084FC" stroke-width="1"/>
    <text x="427" y="17" class="badge-txt">1,000 AGENTS</text>
  </g>

  <!-- Descriptions -->
  <text x="26" y="76" class="desc-en">1,000 AI-Agent Swarm Cross-Code Auditor, Autonomous Error</text>
  <text x="26" y="95" class="desc-en">Debugger &amp; Self-Healing Refactoring Engine with Neural Canvas</text>

  <text x="26" y="122" class="desc-tr">1.000 Yapay Zeka Ajanlı Çapraz Kod Denetleyici, Otonom Hata</text>
  <text x="26" y="140" class="desc-tr">Ayıklama, Yeniden Yapılandırma ve Canlı Sinir Ağı Görselleştirme</text>

  <!-- Footer Tech Tags -->
  <g transform="translate(26, 178)">
    <circle cx="7" cy="7" r="6" fill="#F1E05A"/>
    <text x="20" y="11" class="tag">Python • JavaScript • Multi-Agent LLM • HTML5 Canvas</text>
  </g>
</svg>
