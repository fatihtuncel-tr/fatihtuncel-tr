<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 226" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#0D1526"/>
    </linearGradient>

    <linearGradient id="aboutSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
      <animate attributeName="x1" values="-100%;100%" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="aboutClip">
      <rect width="1200" height="226" rx="16"/>
    </clipPath>

    <style>
      .eyebrow {
        font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #38BDF8;
        letter-spacing: 1.8px;
      }
      .eyebrow-r {
        font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace;
        font-size: 10.5px;
        fill: #475569;
        letter-spacing: 1.4px;
      }
      .lead {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        fill: #E2E8F0;
      }
      .pillar {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #F8FAFC;
      }
      .detail {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 400;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <g clip-path="url(#aboutClip)">
    <rect width="1200" height="226" fill="url(#aboutBg)"/>
    <rect x="0" y="0" width="1200" height="2.5" fill="#1E293B"/>
    <rect x="0" y="0" width="1200" height="2.5" fill="url(#aboutSweep)"/>

    <!-- Section Header -->
    <text x="32" y="34" class="eyebrow">01 // ABOUT</text>
    <text x="1168" y="34" text-anchor="end" class="eyebrow-r">RESEARCH &amp; ENGINEERING PROFILE</text>

    <!-- Executive Summary -->
    <text x="32" y="64" class="lead">Computer &amp; Software Engineering specialist and AI Researcher building trustworthy clinical models &amp; autonomous multi-agent systems.</text>

    <!-- Pillar Row 1 -->
    <g transform="translate(32, 84)">
      <rect width="1136" height="36" rx="9" fill="#0F172A" fill-opacity="0.82" stroke="#1E293B" stroke-width="1"/>
      <circle cx="18" cy="18" r="3.6" fill="#38BDF8">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="22.5" class="pillar">Biomedical AI &amp; DSP</text>
      <text x="234" y="22.5" class="detail">1D CNN &amp; Residual networks (xResNet1d-101, SimpleCNN1D) for reduced-lead ECG classification on PTB-XL.</text>
    </g>

    <!-- Pillar Row 2 -->
    <g transform="translate(32, 128)">
      <rect width="1136" height="36" rx="9" fill="#0F172A" fill-opacity="0.82" stroke="#1E293B" stroke-width="1"/>
      <circle cx="18" cy="18" r="3.6" fill="#818CF8">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="22.5" class="pillar">Trustworthy AI &amp; Fairness</text>
      <text x="234" y="22.5" class="detail">Predictive uncertainty calibration (ECE, Brier Score, MC Dropout) and demographic fairness across age cohorts (ΔECE).</text>
    </g>

    <!-- Pillar Row 3 -->
    <g transform="translate(32, 172)">
      <rect width="1136" height="36" rx="9" fill="#0F172A" fill-opacity="0.82" stroke="#1E293B" stroke-width="1"/>
      <circle cx="18" cy="18" r="3.6" fill="#C084FC">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="22.5" class="pillar">Multi-Agent Swarms</text>
      <text x="234" y="22.5" class="detail">Coordinated 1,000-agent architectures (SWARM-1000) for cross-code auditing, self-healing debugging &amp; neural canvas UI.</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="224.5" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>
</svg>
