<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="sweepCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sweepIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sweepPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sweepEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.1"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="clipCard"><rect width="286" height="126" rx="14"/></clipPath>

    <style>
      .val {
        font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .lbl {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #E2E8F0;
      }
      .sub {
        font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        fill: #64748B;
      }
    </style>
  </defs>

  <!-- Card 1: AUROC -->
  <g transform="translate(1, 3)">
    <g clip-path="url(#clipCard)">
      <rect width="286" height="126" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="286" height="2.5" fill="url(#sweepCyan)"/>
    </g>
    <rect x="0.75" y="0.75" width="284.5" height="124.5" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="262" cy="24" r="3.5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="52" class="val" fill="#38BDF8">0.9256</text>
    <text x="22" y="80" class="lbl">Macro AUROC</text>
    <text x="22" y="102" class="sub">xResNet1d-101 · PTB-XL</text>
  </g>

  <!-- Card 2: Speedup -->
  <g transform="translate(305, 3)">
    <g clip-path="url(#clipCard)">
      <rect width="286" height="126" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="286" height="2.5" fill="url(#sweepIndigo)"/>
    </g>
    <rect x="0.75" y="0.75" width="284.5" height="124.5" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="262" cy="24" r="3.5" fill="#818CF8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="52" class="val" fill="#818CF8">121.6×</text>
    <text x="22" y="80" class="lbl">I/O Pipeline Speedup</text>
    <text x="22" y="102" class="sub">Fold 1–8 NPZ Signal Cache</text>
  </g>

  <!-- Card 3: Swarm -->
  <g transform="translate(609, 3)">
    <g clip-path="url(#clipCard)">
      <rect width="286" height="126" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="286" height="2.5" fill="url(#sweepPurple)"/>
    </g>
    <rect x="0.75" y="0.75" width="284.5" height="124.5" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="262" cy="24" r="3.5" fill="#C084FC">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="52" class="val" fill="#C084FC">1,000</text>
    <text x="22" y="80" class="lbl">Autonomous Agents</text>
    <text x="22" y="102" class="sub">SWARM-1000 Neural Mesh</text>
  </g>

  <!-- Card 4: Zero Leakage -->
  <g transform="translate(913, 3)">
    <g clip-path="url(#clipCard)">
      <rect width="286" height="126" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="286" height="2.5" fill="url(#sweepEmerald)"/>
    </g>
    <rect x="0.75" y="0.75" width="284.5" height="124.5" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="262" cy="24" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="52" class="val" fill="#34D399">18,869</text>
    <text x="22" y="80" class="lbl">Patients Verified</text>
    <text x="22" y="102" class="sub">Zero-Leakage · Bootstrap CI</text>
  </g>
</svg>
