<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18"/>
      <stop offset="50%" stop-color="#0D1526"/>
      <stop offset="100%" stop-color="#090E1B"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <linearGradient id="topBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.15"/>
      <animate attributeName="x1" values="-80%;100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="20%;200%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#C084FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="14%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="84%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect width="1200" height="290" rx="16"/>
    </clipPath>

    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#334155" fill-opacity="0.45"/>
    </pattern>

    <style>
      .eyebrow {
        font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        font-weight: 600;
        fill: #94A3B8;
        letter-spacing: 1.8px;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 50px;
        font-weight: 800;
        letter-spacing: -1.1px;
        fill: url(#titleGrad);
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #CBD5E1;
        letter-spacing: 0.15px;
      }
      .tag-text {
        font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace;
        font-size: 11.5px;
        font-weight: 500;
        fill: #CBD5E1;
      }
      .ecg-trace {
        fill: none;
        stroke: url(#ecgGrad);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1250;
        stroke-dashoffset: 1250;
        animation: drawEcg 5.5s linear infinite;
      }
      @keyframes drawEcg {
        0% { stroke-dashoffset: 1250; opacity: 0.35; }
        75% { stroke-dashoffset: 0; opacity: 0.95; }
        92% { stroke-dashoffset: 0; opacity: 0.95; }
        100% { stroke-dashoffset: -1250; opacity: 0.2; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Surface & Ambient Glows -->
    <rect width="1200" height="290" fill="url(#bgGrad)"/>
    <rect width="1200" height="290" fill="url(#dotGrid)"/>
    <rect width="1200" height="290" fill="url(#glowLeft)"/>
    <rect width="1200" height="290" fill="url(#glowRight)"/>

    <!-- Top Animated Shimmer Hairline -->
    <rect x="0" y="0" width="1200" height="3" fill="#1E293B"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#topBeam)"/>

    <!-- Right-Side Animated Neural Swarm Constellation -->
    <g opacity="0.88">
      <!-- Graph Edges -->
      <line x1="815" y1="68" x2="925" y2="112" stroke="#38BDF8" stroke-width="1.1" stroke-opacity="0.28"/>
      <line x1="925" y1="112" x2="1045" y2="62" stroke="#818CF8" stroke-width="1.1" stroke-opacity="0.28"/>
      <line x1="925" y1="112" x2="1015" y2="188" stroke="#38BDF8" stroke-width="1.1" stroke-opacity="0.28"/>
      <line x1="815" y1="68" x2="852" y2="174" stroke="#818CF8" stroke-width="1.1" stroke-opacity="0.25"/>
      <line x1="852" y1="174" x2="925" y2="112" stroke="#38BDF8" stroke-width="1.1" stroke-opacity="0.28"/>
      <line x1="852" y1="174" x2="1015" y2="188" stroke="#C084FC" stroke-width="1.1" stroke-opacity="0.25"/>
      <line x1="1045" y1="62" x2="1122" y2="134" stroke="#818CF8" stroke-width="1.1" stroke-opacity="0.28"/>
      <line x1="1015" y1="188" x2="1122" y2="134" stroke="#38BDF8" stroke-width="1.1" stroke-opacity="0.28"/>
      <line x1="925" y1="112" x2="1122" y2="134" stroke="#C084FC" stroke-width="0.9" stroke-opacity="0.2" stroke-dasharray="3 4"/>

      <!-- Travelling Signal Packets -->
      <circle r="2.6" fill="#38BDF8" filter="url(#softGlow)">
        <animateMotion dur="3.4s" repeatCount="indefinite" path="M 815 68 L 925 112 L 1045 62 L 1122 134"/>
      </circle>
      <circle r="2.4" fill="#C084FC" filter="url(#softGlow)">
        <animateMotion dur="4.2s" begin="0.8s" repeatCount="indefinite" path="M 1122 134 L 1015 188 L 852 174 L 925 112"/>
      </circle>
      <circle r="2.2" fill="#818CF8" filter="url(#softGlow)">
        <animateMotion dur="3.8s" begin="1.6s" repeatCount="indefinite" path="M 852 174 L 815 68 L 925 112 L 1015 188"/>
      </circle>

      <!-- Gently Breathing Nodes -->
      <circle cx="815" cy="68" r="4.2" fill="#38BDF8">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="925" cy="112" r="6" fill="#818CF8" filter="url(#softGlow)">
        <animate attributeName="r" values="5.4;6.6;5.4" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1045" cy="62" r="4.4" fill="#C084FC">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.9s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="852" cy="174" r="4.2" fill="#38BDF8">
        <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3.5s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1015" cy="188" r="5" fill="#38BDF8">
        <animate attributeName="r" values="4.5;5.6;4.5" dur="4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1122" cy="134" r="4.2" fill="#C084FC">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3.1s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Left Editorial Content -->
    <!-- Live Status Indicator -->
    <g>
      <circle cx="72" cy="52" r="4" fill="#34D399" opacity="0.5">
        <animate attributeName="r" values="4;10;4" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65;0;0.65" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="52" r="3.6" fill="#34D399"/>
      <text x="88" y="56" class="eyebrow">FATIHTUNCEL-TR  //  AI &amp; SOFTWARE ENGINEERING</text>
    </g>

    <!-- Name & Headline -->
    <text x="64" y="116" class="title">Fatih Tunçel</text>
    <text x="64" y="152" class="subtitle">Computer &amp; Software Engineering  ·  Deep Learning Researcher</text>

    <!-- Clean Minimal Domain Pills -->
    <g transform="translate(64, 176)">
      <rect width="176" height="28" rx="7" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#38BDF8"/>
      <text x="26" y="18" class="tag-text">Biomedical AI &amp; ECG</text>
    </g>

    <g transform="translate(250, 176)">
      <rect width="196" height="28" rx="7" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#818CF8"/>
      <text x="26" y="18" class="tag-text">Uncertainty &amp; Fairness</text>
    </g>

    <g transform="translate(456, 176)">
      <rect width="174" height="28" rx="7" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#C084FC"/>
      <text x="26" y="18" class="tag-text">Multi-Agent Swarms</text>
    </g>

    <!-- Animated ECG Signal Waveform Along Lower Stage -->
    <line x1="64" y1="252" x2="1136" y2="252" stroke="#1E293B" stroke-width="1" stroke-opacity="0.65"/>
    <path class="ecg-trace" d="M 64 252 L 320 252 L 336 244 L 348 252 L 368 252 L 376 260 L 388 214 L 399 270 L 410 242 L 424 252 L 690 252 L 706 244 L 718 252 L 738 252 L 746 260 L 758 218 L 769 268 L 780 242 L 794 252 L 1136 252"/>

    <!-- Travelling Luminous ECG Lead Spark -->
    <circle r="3.2" fill="#38BDF8" filter="url(#softGlow)">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M 64 252 L 320 252 L 336 244 L 348 252 L 368 252 L 376 260 L 388 214 L 399 270 L 410 242 L 424 252 L 690 252 L 706 244 L 718 252 L 738 252 L 746 260 L 758 218 L 769 268 L 780 242 L 794 252 L 1136 252"/>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.75;0.92;1" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle Outer Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="288.5" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>
</svg>
