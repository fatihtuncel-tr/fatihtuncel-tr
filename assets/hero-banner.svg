<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#818CF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.0"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -1px;
        fill: url(#titleGrad);
      }
      .subtitle-en {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #38BDF8;
        letter-spacing: 0.4px;
      }
      .subtitle-tr {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #94A3B8;
        letter-spacing: 0.3px;
      }
      .pill-text {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 12.5px;
        font-weight: 600;
        fill: #E2E8F0;
      }
      .ecg-line {
        fill: none;
        stroke: url(#ecgGrad);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
        animation: pulseEcg 7s ease-in-out infinite;
      }
      .node-pulse {
        animation: glowPulse 3.5s ease-in-out infinite alternate;
      }
      @keyframes pulseEcg {
        0% { stroke-dashoffset: 1400; opacity: 0.2; }
        45% { stroke-dashoffset: 0; opacity: 0.95; }
        85% { stroke-dashoffset: 0; opacity: 0.95; }
        100% { stroke-dashoffset: -1400; opacity: 0.2; }
      }
      @keyframes glowPulse {
        0% { opacity: 0.35; transform: scale(0.98); }
        100% { opacity: 0.95; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Outer Card Background -->
  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowLeft)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowRight)"/>

  <!-- Decorative Neural Swarm Mesh on Right Side -->
  <g opacity="0.45" class="node-pulse">
    <line x1="860" y1="70" x2="960" y2="120" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="960" y1="120" x2="1080" y2="85" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="960" y1="120" x2="1020" y2="210" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="860" y1="70" x2="890" y2="185" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="890" y1="185" x2="960" y2="120" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="890" y1="185" x2="1020" y2="210" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="1080" y1="85" x2="1125" y2="175" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="1020" y1="210" x2="1125" y2="175" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>

    <circle cx="860" cy="70" r="4.5" fill="#38BDF8"/>
    <circle cx="960" cy="120" r="6.5" fill="#818CF8"/>
    <circle cx="1080" cy="85" r="5" fill="#C084FC"/>
    <circle cx="890" cy="185" r="5" fill="#38BDF8"/>
    <circle cx="1020" cy="210" r="6" fill="#38BDF8"/>
    <circle cx="1125" cy="175" r="4.5" fill="#C084FC"/>
  </g>

  <!-- Animated ECG / Signal Waveform across the lower background -->
  <path class="ecg-line" d="M 40 275 L 380 275 L 410 275 L 425 260 L 440 280 L 460 275 L 485 275 L 498 288 L 515 195 L 532 305 L 548 250 L 565 275 L 640 275 L 760 275 L 775 262 L 790 275 L 820 275 L 835 288 L 852 205 L 868 298 L 885 252 L 902 275 L 1160 275" />

  <!-- Top Accent Line -->
  <rect x="65" y="48" width="95" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Terminal Greeting Tag -->
  <text x="65" y="82" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" fill="#64748B" letter-spacing="1.5">
    SYSTEM.IDENTITY // FATIHTUNCEL-TR
  </text>

  <!-- Main Name -->
  <text x="65" y="142" class="title">Fatih Tunçel</text>

  <!-- Bilingual Role / Headline -->
  <text x="65" y="182" class="subtitle-en">
    Computer &amp; Software Engineering  •  AI &amp; Deep Learning Researcher
  </text>
  <text x="65" y="210" class="subtitle-tr">
    Bilgisayar ve Yazılım Mühendisliği  •  Yapay Zeka, Derin Öğrenme ve Çoklu Ajan Sistemleri Araştırmacısı
  </text>

  <!-- Feature Pills -->
  <!-- Pill 1 -->
  <g transform="translate(65, 240)">
    <rect width="275" height="34" rx="8" fill="#1E293B" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#38BDF8"/>
    <text x="32" y="21.5" class="pill-text">Medical AI &amp; ECG Analysis</text>
  </g>

  <!-- Pill 2 -->
  <g transform="translate(352, 240)">
    <rect width="290" height="34" rx="8" fill="#1E293B" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#818CF8"/>
    <text x="32" y="21.5" class="pill-text">Uncertainty &amp; AI Fairness</text>
  </g>

  <!-- Pill 3 -->
  <g transform="translate(654, 240)">
    <rect width="285" height="34" rx="8" fill="#1E293B" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#C084FC"/>
    <text x="32" y="21.5" class="pill-text">Multi-Agent Swarm Systems</text>
  </g>

  <!-- Bottom Border Gradient Accent -->
  <rect x="0" y="336" width="1200" height="4" rx="2" fill="url(#accentGrad)" opacity="0.85"/>
</svg>
