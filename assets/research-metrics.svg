<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <style>
      .sec-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: 0.5px;
      }
      .sec-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12.5px;
        fill: #94A3B8;
      }
      .metric-val {
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-size: 28px;
        font-weight: 800;
        fill: #38BDF8;
      }
      .metric-lbl {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #E2E8F0;
      }
      .metric-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.5px;
        fill: #94A3B8;
      }
      .skill-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #E2E8F0;
      }
      .skill-pct {
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #38BDF8;
      }
    </style>
  </defs>

  <!-- Main Container -->
  <rect width="1200" height="310" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Left Panel: Key Research & Engineering Benchmarks -->
  <g transform="translate(35, 30)">
    <text x="0" y="18" class="sec-title">⚡ RESEARCH &amp; SYSTEM BENCHMARKS // ARAŞTIRMA VE SİSTEM METRİKLERİ</text>
    <text x="0" y="38" class="sec-sub">Verified quantitative highlights across active repositories / Aktif projelerdeki doğrulanmış teknik çıktılar</text>

    <!-- Metric Box 1 -->
    <g transform="translate(0, 60)">
      <rect width="265" height="92" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
      <text x="18" y="36" class="metric-val">0.9256</text>
      <text x="18" y="58" class="metric-lbl">Macro AUROC (xResNet1d-101)</text>
      <text x="18" y="76" class="metric-desc">PTB-XL 12-Lead ECG Benchmark</text>
    </g>

    <!-- Metric Box 2 -->
    <g transform="translate(280, 60)">
      <rect width="265" height="92" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
      <text x="18" y="36" class="metric-val" style="fill: #818CF8;">121.6x</text>
      <text x="18" y="58" class="metric-lbl">I/O Pipeline Speedup</text>
      <text x="18" y="76" class="metric-desc">Global Fold 1–8 NPZ Signal Caching</text>
    </g>

    <!-- Metric Box 3 -->
    <g transform="translate(0, 166)">
      <rect width="265" height="92" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
      <text x="18" y="36" class="metric-val" style="fill: #C084FC;">1,000</text>
      <text x="18" y="58" class="metric-lbl">Autonomous Swarm Agents</text>
      <text x="18" y="76" class="metric-desc">Cross-Code Auditing &amp; Self-Debugging</text>
    </g>

    <!-- Metric Box 4 -->
    <g transform="translate(280, 166)">
      <rect width="265" height="92" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
      <text x="18" y="36" class="metric-val" style="fill: #34D399;">0 Leakage</text>
      <text x="18" y="58" class="metric-lbl">18,869 Patients Verified</text>
      <text x="18" y="76" class="metric-desc">Strict Split + Bootstrap 95% CI &amp; ECE</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="610" y1="30" x2="610" y2="280" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Right Panel: Core Competency Distribution -->
  <g transform="translate(640, 30)">
    <text x="0" y="18" class="sec-title">🧠 CORE FOCUS AREAS // TEMEL UZMANLIK ALANLARI</text>
    <text x="0" y="38" class="sec-sub">Primary research &amp; development domains / Başlıca araştırma ve geliştirme alanları</text>

    <!-- Bar 1 -->
    <g transform="translate(0, 68)">
      <text x="0" y="14" class="skill-name">Deep Learning &amp; PyTorch Architectures (1D-CNN / xResNet)</text>
      <text x="480" y="14" class="skill-pct">95%</text>
      <rect x="0" y="24" width="520" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="24" width="494" height="10" rx="5" fill="url(#barBlue)"/>
    </g>

    <!-- Bar 2 -->
    <g transform="translate(0, 118)">
      <text x="0" y="14" class="skill-name">Uncertainty Calibration (ECE, Brier, MC Dropout) &amp; AI Fairness</text>
      <text x="480" y="14" class="skill-pct" style="fill: #818CF8;">92%</text>
      <rect x="0" y="24" width="520" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="24" width="478" height="10" rx="5" fill="url(#barIndigo)"/>
    </g>

    <!-- Bar 3 -->
    <g transform="translate(0, 168)">
      <text x="0" y="14" class="skill-name">Multi-Agent LLM Systems &amp; Automated Code Analysis</text>
      <text x="480" y="14" class="skill-pct" style="fill: #C084FC;">90%</text>
      <rect x="0" y="24" width="520" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="24" width="468" height="10" rx="5" fill="url(#barPurple)"/>
    </g>

    <!-- Bar 4 -->
    <g transform="translate(0, 218)">
      <text x="0" y="14" class="skill-name">Scientific Computing, Biomedical DSP (SciPy/WFDB) &amp; Web UI</text>
      <text x="480" y="14" class="skill-pct" style="fill: #34D399;">88%</text>
      <rect x="0" y="24" width="520" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="24" width="458" height="10" rx="5" fill="url(#barEmerald)"/>
    </g>
  </g>
</svg>
